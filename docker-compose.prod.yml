# Production stack (single VPS). See docs/DOCKER_ARCHITECTURE.md and docs/DEPLOYMENT.md.
# Images are pulled from GHCR by tag — never built on the server.
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#   docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate
name: tahi

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '5' }

x-api-env: &api-env
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: postgresql://tahi_app:${TAHI_APP_PASSWORD:?}@postgres:5432/tahi
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  # Express sees Traefik as the only hop; Traefik itself only trusts Cloudflare ranges.
  TRUST_PROXY: '1'
  APP_HOST: app.tahi.ph
  ADMIN_HOST: admin.tahi.ph
  API_HOST: api.tahi.ph
  STOREFRONT_ROOT_DOMAIN: tahi.ph
  APP_PUBLIC_URL: https://app.tahi.ph
  TENANT_ONBOARDING_STATUS: ${TENANT_ONBOARDING_STATUS:-TRIAL}
  # Cloudflare overwrites this header; only Cloudflare can reach Traefik (DEPLOYMENT.md §3).
  CLIENT_IP_HEADER: cf-connecting-ip
  EMAIL_TRANSPORT: resend
  EMAIL_FROM: ${EMAIL_FROM:-TAHI.ph <no-reply@tahi.ph>}
  RESEND_API_KEY: ${RESEND_API_KEY:?}

services:
  traefik:
    <<: *hardening
    image: traefik:v3.7
    cap_add: [NET_BIND_SERVICE]
    command: ['--configFile=/etc/traefik/traefik.yml']
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?}
      TRAEFIK_CERTIFICATESRESOLVERS_CLOUDFLARE_ACME_EMAIL: ${ACME_EMAIL:?}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infrastructure/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik-acme:/acme
    networks: [edge, socket]
    depends_on: [socket-proxy]
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 15s
      timeout: 5s
      retries: 3

  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1 # read-only container listing; everything else denied by default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket]

  dashboard:
    <<: *hardening
    image: ${IMAGE_REGISTRY:?}/tahi-dashboard:${TAG:?}
    # Next.js needs a writable cache for ISR and image optimization.
    tmpfs: [/tmp, /app/apps/dashboard/.next/cache]
    networks: [edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`app.tahi.ph`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.priority=10
      - traefik.http.routers.dashboard.middlewares=compress@file
      - traefik.http.services.dashboard.loadbalancer.server.port=3000

  admin:
    <<: *hardening
    image: ${IMAGE_REGISTRY:?}/tahi-admin:${TAG:?}
    # Next.js needs a writable cache for ISR and image optimization.
    tmpfs: [/tmp, /app/apps/admin/.next/cache]
    networks: [edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.admin.rule=Host(`admin.tahi.ph`)
      - traefik.http.routers.admin.entrypoints=websecure
      - traefik.http.routers.admin.priority=10
      - traefik.http.routers.admin.middlewares=compress@file
      - traefik.http.services.admin.loadbalancer.server.port=3000

  storefront:
    <<: *hardening
    image: ${IMAGE_REGISTRY:?}/tahi-storefront:${TAG:?}
    # Next.js needs a writable cache for ISR and image optimization.
    tmpfs: [/tmp, /app/apps/storefront/.next/cache]
    networks: [edge]
    labels:
      - traefik.enable=true
      # Tenant subdomains, excluding reserved hosts (those have dedicated routers).
      - traefik.http.routers.storefront.rule=HostRegexp(`^[a-z0-9-]+\.tahi\.ph$`) && !Host(`app.tahi.ph`, `admin.tahi.ph`, `api.tahi.ph`)
      - traefik.http.routers.storefront.entrypoints=websecure
      - traefik.http.routers.storefront.priority=5
      - traefik.http.routers.storefront.middlewares=compress@file
      - traefik.http.services.storefront.loadbalancer.server.port=3000

  api:
    <<: *hardening
    image: ${IMAGE_REGISTRY:?}/tahi-api:${TAG:?}
    environment:
      <<: *api-env
      API_PORT: '3000'
      DATABASE_POOL_MAX: '10'
    networks: [edge, internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    labels:
      - traefik.enable=true
      # Same-origin /api on every host (docs/SYSTEM_ARCHITECTURE.md §3).
      - traefik.http.routers.api.rule=PathPrefix(`/api`) && (Host(`app.tahi.ph`, `admin.tahi.ph`, `api.tahi.ph`) || HostRegexp(`^[a-z0-9-]+\.tahi\.ph$`))
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.priority=100
      - traefik.http.services.api.loadbalancer.server.port=3000
      - traefik.docker.network=tahi_edge

  worker:
    <<: *hardening
    image: ${IMAGE_REGISTRY:?}/tahi-api:${TAG:?}
    command: ['node', 'dist/main.worker.js']
    environment:
      <<: *api-env
      DATABASE_POOL_MAX: '5'
    networks: [internal, egress]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', 'dist/worker-healthcheck.js']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  migrate:
    image: ${IMAGE_REGISTRY:?}/tahi-api:${TAG:?}
    profiles: [migrate]
    working_dir: /app/packages/database
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://tahi_owner:${TAHI_OWNER_PASSWORD:?}@postgres:5432/tahi
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      POSTGRES_DB: tahi
      TAHI_OWNER_PASSWORD: ${TAHI_OWNER_PASSWORD:?}
      TAHI_APP_PASSWORD: ${TAHI_APP_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    shm_size: 256m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tahi']
      interval: 10s
      timeout: 5s
      retries: 10
    # No `ports:` — never exposed outside the internal network.

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?}', '--appendonly', 'yes']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    # No `ports:` — never exposed outside the internal network.

networks:
  edge:
    name: tahi_edge
  internal:
    name: tahi_internal
    internal: true
  egress:
    name: tahi_egress
  socket:
    name: tahi_socket
    internal: true

volumes:
  pgdata:
  redisdata:
  traefik-acme:
