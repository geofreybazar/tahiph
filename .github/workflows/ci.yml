name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@12.0.2
      - run: npm ci
      - name: Create the database roles Supabase would provide
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -c "CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;"
          psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -f supabase/roles.sql
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # Real Supabase, because these journeys need its auth, storage and email.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@12.0.2
      - run: npm ci
      - run: npx supabase start --exclude studio,imgproxy,vector,logflare,edge-runtime,postgres-meta
      - name: Create the application roles
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -p 54322 -U postgres -v ON_ERROR_STOP=1 -f supabase/roles.sql
      - name: Write .env from the local stack
        run: |
          eval "$(npx supabase status -o env)"
          sed -e "s/^SUPABASE_SECRET_KEY=.*/SUPABASE_SECRET_KEY=$SECRET_KEY/" \
              -e "s/^VITE_SUPABASE_PUBLISHABLE_KEY=.*/VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY/" \
              .env.example > .env
      - run: npm run db:deploy
      - run: npx turbo run build --filter=@tahi/api
      - run: npx playwright install --with-deps chromium
        working-directory: apps/admin
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/admin/playwright-report
            apps/admin/test-results
          retention-days: 7
