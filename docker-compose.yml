# Local development infrastructure. Apps run on the host with `npm run dev`.
#   docker compose up -d
# Ports bind to 127.0.0.1 only. Copy .env.example to .env first.
name: tahi-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      POSTGRES_DB: tahi
      TAHI_OWNER_PASSWORD: ${TAHI_OWNER_PASSWORD:?set in .env}
      TAHI_APP_PASSWORD: ${TAHI_APP_PASSWORD:?set in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tahi']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set in .env}', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # S3-compatible object storage for uploads (ADR-031). Run `npm run setup-storage -w @tahi/api`
  # once to create the bucket. Production uses Cloudflare R2.
  rustfs:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?set in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?set in .env}
    ports:
      - '127.0.0.1:9000:9000'
    volumes:
      - s3data:/data

  mailpit:
    image: axllent/mailpit:v1
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # Web UI

volumes:
  pgdata:
  redisdata:
  s3data:
